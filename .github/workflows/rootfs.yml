name: rootfs
on:
  workflow_dispatch:
    inputs:
      devices:
        description: "Space-separated: qqcandy pearl xaga xaga-6.18 rubens"
        default: "qqcandy"
        required: true
      distros:
        description: "Space-separated: mobian arch nura debian"
        default: "mobian arch nura"
        required: true
      ui:
        description: "User interface"
        type: choice
        options: [phosh, console]
        default: phosh
      userspace_only:
        description: "Tar-only export; all builds are userspace-only"
        type: boolean
        default: false
      baseband:
        description: "Install baseband userspace; hardware startup remains gated"
        type: choice
        options: [auto, "on", "off"]
        default: auto
      publish_release:
        description: "Publish only after all selected builds succeed"
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: rootfs-${{ github.ref }}-${{ inputs.distros }}-${{ inputs.userspace_only }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ts: ${{ steps.matrix.outputs.ts }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          DEVICES: ${{ inputs.devices }}
          DISTROS: ${{ inputs.distros }}
        run: |
          python3 tools/matrix.py "$DEVICES" "$DISTROS" >> "$GITHUB_OUTPUT"
          echo "ts=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.variant }} / ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap arch-test debian-archive-keyring \
            qemu-user-static binfmt-support libarchive-tools gnupg \
            e2fsprogs android-sdk-libsparse-utils pigz zstd kmod rsync \
            build-essential python3 multipath-tools openssl \
            git curl ca-certificates xz-utils
          sudo update-binfmts --enable qemu-aarch64
          sudo arch-test arm64
      - name: Build
        env:
          DEVICE: ${{ matrix.device }}
          DISTRO: ${{ matrix.distro }}
          SUFFIX: ${{ matrix.suffix }}
          UI: ${{ inputs.ui }}
          USERSPACE_ONLY: ${{ inputs.userspace_only }}
          BASEBAND: ${{ inputs.baseband }}
          TS: ${{ needs.prepare.outputs.ts }}
        run: |
          set -euo pipefail
          args=(--device "$DEVICE" --distro "$DISTRO" --ui "$UI" --baseband "$BASEBAND"
                --ts "$TS" --out "$PWD/out" --jobs 2 --tar)
          if [ "$USERSPACE_ONLY" = true ]; then
            args+=(--no-image)
          fi
          [ -z "$SUFFIX" ] || args+=(--name-suffix "$SUFFIX")
          sudo -E bash ./build.sh "${args[@]}"
          cd out
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.variant }}-${{ matrix.distro }}
          path: out/*
          if-no-files-found: error
  release:
    needs: [prepare, build]
    if: inputs.publish_release && !inputs.userspace_only
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rootfs-*
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' |
            sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ needs.prepare.outputs.ts }}
          draft: true
          files: release/*
          body: |
            ARM64 userspace rootfs only. Supply a separately validated device boot.
            No kernel, DTB, initramfs or kernel modules are built by this workflow.
            No extracted vendor firmware or modem NVRAM is injected.
            Default local user PIN: 1234. Root and SSH password login are disabled.
            Build success is not device boot/IMS/VCP hardware validation.
