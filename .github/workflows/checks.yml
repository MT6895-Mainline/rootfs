name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - name: Bash syntax
        run: |
          for f in build.sh distros/*.sh tools/*.sh baseband/ModemManager baseband/start-owner baseband/*.initd; do bash -n "$f"; done
      - name: Shell contracts
        run: |
          shellcheck -x -e SC1090,SC1091,SC2034,SC2154,SC2016,SC2048,SC2086,SC2012,SC2094 \
            build.sh distros/*.sh tools/with-qemu.sh tools/install-baseband.sh \
            baseband/ModemManager baseband/start-owner baseband/*.initd
