# MT6895-Mainline bring-up tuning.
#
# While the baseband is not ready yet, the CCCI FSM kthread sleeps in its HS2
# wait loop and the kernel reports it as a hung task every ~20 seconds.  That
# is expected on these devices and is not a filesystem/hang bug, but it floods
# dmesg.  Uncomment the line below if you want a quiet console - keep in mind
# that it also hides genuine hung tasks.
#
#kernel.hung_task_timeout_secs = 0

# Vendor stacks (connsys/WiFi, GPU exception handling) are chatty by default.
kernel.printk = 4 4 1 7
