# Device profile: Xiaomi xaga
# Two kernel lines exist upstream in MT6895-Mainline/linux:
#   7.2-mt6895-xiaomi-xaga   (this profile)
#   6.18-mt6895-xiaomi-xaga  -> build with: --kernel-ref 6.18-mt6895-xiaomi-xaga
PLATFORM_NAME="Xiaomi xaga"
SOC="mt6895"

KERNEL_BRANCH="7.2-mt6895-xiaomi-xaga"
KERNEL_CONFIGS="xaga.config"
DTS="mt6895-xiaomi-xaga.dts"

# The xaga images in use are clang builds; set KERNEL_MAKE_ARGS="" for a GCC kernel.
KERNEL_MAKE_ARGS="LLVM=1"

# A git kernel build that is not at a tagged commit reports "<version>+", and
# /lib/modules/ is named after that.  CI builds from an exported tree, which
# produces a bare version, so the suffix is pinned here.  Verify with
# `uname -r` on the device and override with --kernel-localversion / the
# kernel_localversion workflow input (use "" if your kernel has no suffix).
KERNEL_LOCALVERSION="+"

# Kept identical to the existing xaga images built by the sibling project
# (xaga-mt6895-mainline-build uses mkfs.ext4 -L xaga-rootfs).
ROOTFS_LABEL="xaga-rootfs"
DEFAULT_USER="mobian"

USERDATA_PART="/dev/sdc86"
NVDATA_PART="/dev/sdc13"

PACKAGES_CORE="systemd systemd-sysv systemd-resolved systemd-timesyncd openssh-server sudo kmod"
PACKAGES_EXTRA="network-manager bluez modemmanager iio-sensor-proxy \
                alsa-ucm-conf alsa-utils usbutils pciutils iproute2 \
                less nano zstd e2fsprogs"

FIRMWARE_HINTS="mediatek/mt6895/WIFI mediatek/mt6895/*.bin mali_csffw.bin"
