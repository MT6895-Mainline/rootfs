# Device profile: Xiaomi rubens
# Port branch: port/rubens-clean (kernel 7.2.0 in tree at the time of writing).
# NOTE: this port is still in progress upstream - expect the DTS and the
# module set to change.  The profile is kept here so the matrix already
# builds something once the port lands.
PLATFORM_NAME="Xiaomi rubens"
SOC="mt6895"

KERNEL_BRANCH="port/rubens-clean"
KERNEL_CONFIGS="rubens.config"
DTS="mt6895-xiaomi-rubens.dts"

# Same convention as the other MT6895 profiles: clang build, git-style version
# suffix in `uname -r`.  TODO: confirm once the port boots.
KERNEL_MAKE_ARGS="LLVM=1"
KERNEL_LOCALVERSION="+"

ROOTFS_LABEL="mt6895rubens"
DEFAULT_USER="mobian"

# TODO: confirm on a running rubens (port still in progress)
USERDATA_PART="/dev/sdc86"
NVDATA_PART="/dev/sdc13"

PACKAGES_CORE="systemd systemd-sysv systemd-resolved systemd-timesyncd openssh-server sudo kmod"
PACKAGES_EXTRA="network-manager bluez modemmanager iio-sensor-proxy \
                alsa-ucm-conf alsa-utils usbutils pciutils iproute2 \
                less nano zstd e2fsprogs"

FIRMWARE_HINTS="mediatek/mt6895/WIFI mediatek/mt6895/*.bin mali_csffw.bin"
