# Device profile: Xiaomi Civi 3 (yuechu)
# Kernel branch 7.2-mt6895-xiaomi-yuechu (in MT6895-Mainline/linux).
#
# Same SoC generation as pearl (MT6895, md_generation 0x189a, identical
# CCCI/SCP memory map); the differences are the panel (1080x2400, LK
# framebuffer at 0xFE20F000) and the device tree, both handled by the kernel
# branch.  The rootfs side is shared with the other MT6895 devices.
PLATFORM_NAME="Xiaomi Civi 3 (yuechu)"
SOC="mt6895"

KERNEL_BRANCH="7.2-mt6895-xiaomi-yuechu"
KERNEL_CONFIGS="yuechu.config"
DTS="mt6895-xiaomi-yuechu.dts"

# Same convention as the other MT6895 profiles: clang kernel builds with a
# git-style version suffix in `uname -r`.  Verify on the running device
# before trusting the module directory.
KERNEL_MAKE_ARGS="LLVM=1"
KERNEL_LOCALVERSION="+"

ROOTFS_LABEL="archyuechu"
DEFAULT_USER="mobian"

# The Civi 3 shares pearl's partition numbering (GPT label userdata/nvdata);
# re-verify with by-partlabel before flashing an image.
USERDATA_PART="/dev/sdc86"
NVDATA_PART="/dev/sdc13"

PACKAGES_CORE="systemd systemd-sysv systemd-resolved systemd-timesyncd openssh-server sudo kmod"
PACKAGES_EXTRA="network-manager bluez modemmanager iio-sensor-proxy \
                alsa-ucm-conf alsa-utils usbutils pciutils iproute2 \
                less nano zstd e2fsprogs dosfstools"

FIRMWARE_HINTS="mediatek/mt6895/WIFI mediatek/mt6895/*.bin mali_csffw.bin"

# Install the user-space VA-API driver and the baseband bundle pinned to the
# same organization sources as qqcandy.  Hardware startup of the modem (and
# the VCP firmware ABI) stays a separate, validated step: the builder only
# installs the userspace and never starts MD/IMS by itself.
VAAPI_REPO="https://github.com/MT6895-Mainline/vaapi-mtk-vcp.git"
VAAPI_COMMIT="06537ac7f6435bdd83651aaf5521e477506f4ee6"
BASEBAND_OWNER_REPO="https://github.com/MT6895-Mainline/mtk-ccci-userspace.git"
BASEBAND_OWNER_BRANCH="main"
BASEBAND_MM_REPO="https://github.com/MT6895-Mainline/modemmanager-mtk-soc.git"
BASEBAND_MM_BRANCH="mtk-soc-1.24.2"
