# Device profile: Xiaomi Redmi Note 12T Pro (pearl)
# Kernel branch 7.2-mt6895-xiaomi-pearl (in MT6895-Mainline/linux).
PLATFORM_NAME="Xiaomi Redmi Note 12T Pro (pearl)"
SOC="mt6895"

KERNEL_BRANCH="7.2-mt6895-xiaomi-pearl"
KERNEL_CONFIGS="pearl.config"
DTS="mt6895-xiaomi-pearl.dts"

# How the kernel is built.  The pearl boot images in use are built with clang
# (make LLVM=1); modules must come from the same toolchain.  Set it to "" if
# your kernel is a GCC build.
KERNEL_MAKE_ARGS="LLVM=1"

# The running kernel reports 7.2.7+ : the trailing "+" is what a git tree that is
# not at a tagged commit adds, and /lib/modules/ is named after it.  A build from
# an exported tree (which is what CI does) produces a bare 7.2.7, so the modules
# would land in a directory the kernel never looks at.  Pinning the local version
# makes the two agree; build.sh only applies it when the tree does not already
# produce it.
#   $ ssh <device> uname -r    ->   7.2.7+
KERNEL_LOCALVERSION="+"

# The root filesystem lives in the userdata partition as an ext4 filesystem
# with this label.  Verified on a running pearl:
#   /dev/sdc86 -> partlabel "userdata", label "archpearl"
ROOTFS_LABEL="archpearl"
DEFAULT_USER="mobian"

# Partition device nodes used by the initramfs / first boot on this SoC family
# (verified on pearl and xaga: userdata is /dev/sdc86, nvdata is /dev/sdc13 -
# these are kernel device nodes, NOT fastboot partition names).
USERDATA_PART="/dev/sdc86"
NVDATA_PART="/dev/sdc13"

PACKAGES_CORE="systemd systemd-sysv systemd-resolved systemd-timesyncd openssh-server sudo kmod"
PACKAGES_EXTRA="network-manager bluez modemmanager iio-sensor-proxy \
                alsa-ucm-conf alsa-utils usbutils pciutils iproute2 \
                less nano zstd e2fsprogs dosfstools"

# Files the vendor firmware must provide (BYO blobs, installed with
# --firmware or tools/install-firmware.sh; never redistributed here).
FIRMWARE_HINTS="mediatek/mt6895/WIFI mediatek/mt6895/*.bin mali_csffw.bin"
