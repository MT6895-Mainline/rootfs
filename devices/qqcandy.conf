# Device profile: OPPO K10 / OnePlus Ace Racing Edition (qqcandy)
# Kernel branch 6.18-mt6895-oplus-qqcandy (in MT6895-Mainline/linux).
PLATFORM_NAME="OPPO K10 / OnePlus Ace Racing (qqcandy)"
SOC="mt6895"

# External boot reference only; no kernel or initramfs build in this repo.
BOOT_KERNEL_BRANCH="6.18-mt6895-oplus-qqcandy"

ROOTFS_LABEL="mt6895qqcandy"
DEFAULT_USER="mobian"

# Verified from /sys/class/block/*/uevent and by-partlabel on qqcandy.
USERDATA_PART="/dev/sdc80"
NVDATA_PART="/dev/sdc10"

PACKAGES_CORE="systemd systemd-sysv systemd-resolved systemd-timesyncd openssh-server sudo kmod"
PACKAGES_EXTRA="network-manager bluez modemmanager iio-sensor-proxy \
                alsa-ucm-conf alsa-utils usbutils pciutils iproute2 \
                less nano zstd e2fsprogs"

# qqcandy has a battery dtsi in tree (mt6895-oplus-qqcandy-battery.dtsi); its
# charger/BMS nodes are wired through the mainline drivers already.
FIRMWARE_HINTS="mediatek/mt6895/WIFI mediatek/mt6895/*.bin mali_csffw.bin"

# Install the user-space backend, but do not force LIBVA_DRIVER_NAME or enable
# the unvalidated qqcandy VCP kernel node/firmware ABI.
VAAPI_REPO="https://github.com/MT6895-Mainline/vaapi-mtk-vcp.git"
VAAPI_COMMIT="06537ac7f6435bdd83651aaf5521e477506f4ee6"
QUIRKS_REPO="https://github.com/MT6895-Mainline/quirks.git"
QUIRKS_COMMIT="15b5b0267f6d0e497696e33d8ebe88f7146c7ee0"

# Resolve latest once per build; the manifest records immutable source commits.
BASEBAND_OWNER_REPO="https://github.com/MT6895-Mainline/mtk-ccci-userspace.git"
BASEBAND_OWNER_BRANCH="main"
BASEBAND_MM_REPO="https://github.com/MT6895-Mainline/modemmanager-mtk-soc.git"
BASEBAND_MM_BRANCH="mtk-soc-1.24.2"
